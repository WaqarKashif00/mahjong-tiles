<div class="game-over" [class.game-over--visible]="visible()">

  <!-- ── Decorative tiles (background) ──────────────────────────────────── -->
  <div class="game-over__deco" aria-hidden="true">
    <span class="deco-tile">中</span>
    <span class="deco-tile">發</span>
    <span class="deco-tile">白</span>
  </div>

  <!-- ── Card ────────────────────────────────────────────────────────────── -->
  <div class="game-over__card">

    <!-- Header -->
    <div class="game-over__header">
      <span class="game-over__icon">{{ reasonIcon }}</span>
      <h1 class="game-over__title">Game Over</h1>
      <p class="game-over__reason">{{ gameOverMessage() }}</p>
    </div>

    <!-- Score block -->
    <div class="game-over__score-block">
      <span class="game-over__score-label">Final Score</span>
      <span class="game-over__score-value">{{ score() | number }}</span>
      <span class="game-over__rounds">{{ round() - 1 }} round{{ round() !== 2 ? 's' : '' }} played</span>
    </div>

    <!-- High score banner -->
    <div class="game-over__high-score" *ngIf="isHighScore() && !submitted()">
      <span class="high-score__badge">🏆 New High Score!</span>
      <p class="high-score__hint">Enter your name to save it to the leaderboard.</p>
    </div>

    <!-- Submitted confirmation -->
    <div class="game-over__saved" *ngIf="submitted()">
      <span class="saved__icon">✓</span>
      <span class="saved__label">Score saved as <strong>{{ playerName() || 'Anonymous' }}</strong></span>
    </div>

    <!-- Name input form (only shown for high scores before submitting) -->
    <form
      class="game-over__form"
      *ngIf="isHighScore() && !submitted()"
      (ngSubmit)="submitScore()"
    >
      <div class="form-field">
        <label class="form-field__label" for="playerName">Your name</label>
        <div class="form-field__row">
          <input
            id="playerName"
            name="playerName"
            class="form-field__input"
            type="text"
            placeholder="Anonymous"
            maxlength="24"
            autocomplete="off"
            [ngModel]="playerName()"
            (ngModelChange)="playerName.set($event)"
          />
          <button type="submit" class="btn btn--submit">
            Save Score
          </button>
        </div>
      </div>
    </form>

    <!-- Actions -->
    <div class="game-over__actions">
      <button class="btn btn--primary" (click)="playAgain()">
        <span class="btn__icon">🀄</span>
        Play Again
      </button>
      <button class="btn btn--secondary" (click)="goHome()">
        <span class="btn__icon">🏠</span>
        Leaderboard
      </button>
    </div>

  </div>
</div>
